<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>OpenTrak Scheduler</title>
<style>
/*FONTS*/
:root{
  --font:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --row:28px; --head:48px; --fs:12px;
  --r-sm:6px; --r:8px; --r-lg:14px;
  --accent:#4c8dff; --accent-ink:#fff; --accent-hover:#3a7bf0;
  --ok:#3ecf6e; --warn:#f5b83d; --bad:#ff5a5f; --violet:#a78bfa; --teal:#2dd4bf; --sky:#60a5fa; --amber:#f5b83d; --slate:#94a3b8;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#10151c; --rail:#0d1218; --panel:#161c25; --panel-2:#1b2230; --raised:#212a38; --field:#121821;
  --line:#263142; --line-2:#1e2735; --text:#e6ebf2; --muted:#8e9aac; --faint:#7f8ca0;
  --head:#1b2230; --group:#1e2633; --group-ink:#cdd6e3; --hover:rgba(76,141,255,.06); --sel:rgba(76,141,255,.16); --sel-line:#4c8dff;
  --nonwork:rgba(255,255,255,.025); --grid:#202938; --dd:#38bdf8; --link:#7c8799; --ms-stroke:rgba(0,0,0,.55);
  --accent-fg:#6ea4ff; --accent-glow:rgba(76,141,255,.28); --field-line:#617089; --tint-sky:rgba(96,165,250,.14);
  --accent:#2f6fe4; --accent-hover:#2862cf;
  --shadow:0 18px 50px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
  --tint-accent:rgba(76,141,255,.14); --tint-violet:rgba(167,139,250,.14); --tint-ok:rgba(62,207,110,.13); --tint-warn:rgba(245,184,61,.14); --tint-bad:rgba(255,90,95,.14); --tint-slate:rgba(148,163,184,.12);
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#eef1f5; --rail:#ffffff; --panel:#ffffff; --panel-2:#f6f8fb; --raised:#ffffff; --field:#ffffff;
  --line:#dfe4eb; --line-2:#edf0f4; --text:#18202b; --muted:#5f6b7c; --faint:#6b7686;
  --head:#f6f8fb; --group:#eef2f7; --group-ink:#253041; --hover:rgba(37,99,235,.04); --sel:rgba(37,99,235,.10); --sel-line:#2563eb;
  --nonwork:rgba(15,23,42,.035); --grid:#eceff3; --dd:#0284c7; --link:#7a8597; --ms-stroke:rgba(0,0,0,.6);
  --accent-fg:#1d4ed8; --accent-glow:rgba(37,99,235,.25); --field-line:#8a95a5; --tint-sky:rgba(2,132,199,.10);
  --accent:#2563eb; --accent-hover:#1d4ed8; --ok:#157a3a; --warn:#a74c08; --bad:#b91c1c; --violet:#7c3aed; --teal:#0d9488; --sky:#0284c7; --amber:#d97706; --slate:#64748b;
  --shadow:0 18px 50px rgba(15,23,42,.18), 0 2px 8px rgba(15,23,42,.08);
  --tint-accent:rgba(37,99,235,.10); --tint-violet:rgba(124,58,237,.10); --tint-ok:rgba(22,163,74,.10); --tint-warn:rgba(217,119,6,.12); --tint-bad:rgba(220,38,38,.10); --tint-slate:rgba(100,116,139,.10);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:11px;height:11px} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid transparent;background-clip:content-box} ::-webkit-scrollbar-thumb:hover{background-color:var(--faint)} ::-webkit-scrollbar-corner{background:transparent}

.app{display:grid;grid-template-columns:56px 1fr;height:100vh;height:100dvh}
/* rail */
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px;background:linear-gradient(145deg,#1f2a3b,#121924);border:1px solid var(--line)}
:root[data-theme="light"] .mark{background:#f2f5f9}
.rb{position:relative;width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.rb svg.i{width:19px;height:19px}
.rb:hover{background:var(--raised);color:var(--text)}
.rb[data-c="teal"] svg{color:var(--teal)} .rb[data-c="amber"] svg{color:var(--amber)} .rb[data-c="violet"] svg{color:var(--violet)} .rb[data-c="sky"] svg{color:var(--sky)} .rb[data-c="slate"] svg{color:var(--slate)}
.rb::after{content:attr(data-tip);position:absolute;left:48px;top:50%;transform:translateY(-50%);background:var(--raised);color:var(--text);border:1px solid var(--line);padding:5px 9px;border-radius:7px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:var(--shadow);z-index:40}
.rb:hover::after,.rb:focus-visible::after{opacity:1}
.rail .grow{flex:1}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
/* header */
.hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-height:60px;overflow-x:auto;scrollbar-width:none}
.hdr::-webkit-scrollbar{display:none}
.hdr>*{flex:none}
.hdr>.title{flex:0 1 auto;min-width:150px}
.title .pname{width:100%}
.title{display:flex;flex-direction:column;gap:2px;min-width:0}
.title small{font-size:11.5px;color:var(--muted)}
.pname{border:1px solid transparent;background:transparent;border-radius:var(--r-sm);padding:2px 6px;margin-left:-7px;font-size:16px;font-weight:600;letter-spacing:-.1px;min-width:140px;max-width:440px;text-overflow:ellipsis}
.pname:hover{border-color:var(--line)} .pname:focus{border-color:var(--accent-fg);outline:none;background:var(--field)}
.pills{display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.pill b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.pill.bad{background:var(--tint-bad);border-color:transparent;color:var(--bad)} .pill.bad b{color:var(--bad)}
.pill.ok{background:var(--tint-ok);border-color:transparent;color:var(--ok)} .pill.ok b{color:var(--ok)}
.pill input[type=date]{border:0;background:transparent;color:var(--text);font-weight:600;padding:0;width:118px;font-variant-numeric:tabular-nums}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--crit)}
.sp{flex:1}
.acts{display:flex;align-items:center;gap:8px}
.btn{height:34px;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r);padding:0 12px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500;color:var(--text);transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--raised);border-color:var(--faint)} .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.35;cursor:default;transform:none}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 4px 14px var(--accent-glow)} .btn.pri:hover{background:var(--accent-hover)}
.btn.violet{background:var(--tint-violet);border-color:transparent;color:var(--violet)}
.btn.slate{background:var(--tint-slate);border-color:transparent}
.btn.okc{background:var(--tint-ok);border-color:transparent;color:var(--ok)} .btn.warnc{background:var(--tint-warn);border-color:transparent;color:var(--warn)} .btn.badc{background:var(--tint-bad);border-color:transparent;color:var(--bad)}
.btn.violet:hover,.btn.slate:hover,.btn.okc:hover,.btn.warnc:hover,.btn.badc:hover{filter:brightness(1.18);background-color:inherit}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{background:var(--raised);color:var(--text)}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.on{background:var(--tint-accent);border-color:transparent;color:var(--accent-fg)}
.btn.danger{color:var(--bad);background:var(--tint-bad);border-color:transparent}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:600;display:inline-grid;place-items:center;background:currentColor}
.badge>span{color:var(--panel)}
kbd{font:inherit;font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px}
/* toolbar */
.tb{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none} .tb>*{flex:none}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:9px;color:var(--faint)}
.search input{height:32px;width:220px;border:1px solid var(--field-line);border-radius:var(--r);padding:0 10px 0 30px;background:var(--field)}
.search input:focus{outline:none;border-color:var(--accent-fg);box-shadow:0 0 0 3px var(--tint-accent)}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line)}
.seg button{height:26px;border:0;background:transparent;padding:0 10px;border-radius:6px;color:var(--muted);font-weight:500;font-size:12.5px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25),0 0 0 1px var(--line)}
:root[data-theme="light"] .seg button.on{background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.12),0 0 0 1px var(--line)}
.vr{width:1px;height:22px;background:var(--line)}
.sw{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;cursor:pointer;user-select:none}
.sw input{appearance:none;width:28px;height:16px;border-radius:9px;background:var(--field-line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--accent)} .sw input:checked::after{transform:translateX(12px)}
.sw:hover{color:var(--text)}
.legend{display:inline-flex;gap:12px;align-items:center;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:14px;height:7px;border-radius:2px;vertical-align:1px;margin-right:5px}
/* main split */
.main{flex:1;display:flex;min-height:0;position:relative;background:var(--panel);overflow:hidden}
.pane{overflow:auto;min-width:0;background:var(--panel)}
#left{flex:none;width:640px;border-right:1px solid var(--line)}
#right{flex:1}
.split{width:7px;margin:0 -4px;cursor:col-resize;z-index:5;flex:none;position:relative}
.split::after{content:"";position:absolute;inset:0 3px;background:transparent;transition:background .12s}
.split:hover::after,.split.drag::after{background:var(--accent)}
.main.v-table #right,.main.v-table .split{display:none} .main.v-table #left{flex:1;width:auto!important;border-right:0}
.main.v-gantt #left,.main.v-gantt .split{display:none}
/* grid */
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
.grid th{position:sticky;top:0;z-index:3;height:var(--head);background:var(--head);border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);font-weight:500;font-size:11.5px;color:var(--muted);text-align:left;padding:0 9px;white-space:normal;line-height:1.25;overflow:hidden}
.grid th .rz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
.grid th .rz:hover,.grid th .rz.on{background:var(--accent)}
.grid td{height:var(--row);border-bottom:1px solid var(--line-2);padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs)}
.grid td.n,.grid th.n{text-align:right;font-variant-numeric:tabular-nums}
.grid td.d{font-variant-numeric:tabular-nums;color:var(--text);padding:0 7px}
.grid td.c-code{color:var(--muted);font-variant-numeric:tabular-nums}
.grid tr.act:hover td{background:var(--hover)}
.grid tr.sel td{background:var(--sel)!important}
.grid tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--sel-line)}
.grid tr.crit td.c-name{color:var(--crit-ink)}
.grid tr.sel.crit td.c-name{color:var(--text)}
.grid tr.done td{color:var(--muted)}
.grid tr.g td{background:var(--group);color:var(--group-ink);font-weight:600;cursor:pointer;border-bottom-color:var(--line)}
.grid td.ed{cursor:text}
.grid td .tw{display:inline-block;width:16px;color:var(--muted);font-size:10px}
.grid td.c-name .dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:8px;vertical-align:1px;background:var(--faint)}
.dot.active{background:var(--bar)!important} .dot.done{background:var(--done)!important} .dot.crit{background:var(--crit)!important}
.dms{display:inline-block;width:8px;height:8px;transform:rotate(45deg);margin-right:8px;vertical-align:0}
.grid td input.cell{width:100%;height:calc(var(--row) - 6px);border:1.5px solid var(--accent-fg);border-radius:5px;padding:0 5px;margin:0 -6px;background:var(--field);outline:none;box-shadow:0 0 0 3px var(--tint-accent)}
.grid td.n input.cell{text-align:right}
.neg{color:var(--bad);font-weight:600} .pos{color:var(--ok)}
.a{color:var(--muted);font-size:10.5px;margin-left:2px}
/* gantt */
#gwrap{position:relative}
#gantt{display:block}
#gantt text{font-size:calc(var(--fs) - 1px);fill:var(--text);font-family:var(--font);pointer-events:none}
#gantt .th{fill:var(--muted);font-size:10.5px;opacity:1}
#gantt .tm{fill:var(--text);font-weight:600;font-size:11.5px;opacity:1}
.bar{cursor:pointer}
.rh{cursor:ew-resize;fill:transparent}
.lk{fill:var(--panel);stroke:var(--accent-fg);stroke-width:1.6;cursor:crosshair;opacity:0}
g.ab:hover .lk,g.ab.sel .lk{opacity:1}
.link{fill:none;stroke:var(--link);stroke-width:1;opacity:.75}
.link.drv{opacity:1}
.link.crit{stroke:var(--crit);opacity:.9}
/* drawer */
.drawer{position:absolute;right:0;top:0;bottom:0;width:384px;background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;z-index:20;transform:translateX(100%);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dh .t{flex:1;min-width:0}
.dh .t b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .t small{color:var(--muted);font-size:12px}
.db{overflow:auto;padding:14px;flex:1}
.sec{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line-2)}
.sec:last-of-type{border-bottom:0}
.sec h4{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--text)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fg .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.inp,.sel{height:32px;border:1px solid var(--field-line);border-radius:var(--r-sm);padding:0 9px;background:var(--field);min-width:0;width:100%;color:var(--text)}
.inp:focus,.sel:focus{outline:none;border-color:var(--accent-fg);box-shadow:0 0 0 3px var(--tint-accent)}
.inp:disabled{opacity:.45}
textarea.inp{height:auto;min-height:70px;padding:8px 9px;resize:vertical}
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 12px;font-size:12.5px}
.kv span{color:var(--muted)} .kv b{font-weight:500;font-variant-numeric:tabular-nums}
.rl{width:100%;border-collapse:collapse;font-size:12.5px}
.rl td{padding:5px 4px;border-bottom:1px solid var(--line-2)} .rl td:first-child{padding-left:0}
.rl a{color:var(--accent-fg);text-decoration:none;font-weight:500} .rl a:hover{text-decoration:underline}
.rl select,.rl input{height:26px;border:1px solid var(--field-line);border-radius:5px;padding:0 4px;background:var(--field)}
.rl input{width:50px;text-align:right}
.x{border:0;background:transparent;color:var(--faint);width:28px;height:28px;border-radius:7px;display:inline-grid;place-items:center}
.x:hover{background:var(--tint-bad);color:var(--bad)}
.addrow{display:flex;gap:6px;margin-top:8px}
.drv-tag{font-size:11px;color:var(--accent-fg);background:var(--tint-accent);border-radius:4px;padding:1px 5px;margin-left:5px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,8,12,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
:root[data-theme="light"] .ov{background:rgba(15,23,42,.3)}
.ov.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);width:min(640px,100%);max-height:90vh;display:flex;flex-direction:column;animation:pop .16s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.mh .sp{flex:1}
.mb{padding:16px 18px;overflow:auto}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.wd{display:flex;gap:4px;flex-wrap:wrap}
.wd label{display:flex;align-items:center;gap:4px;border:1px solid var(--field-line);border-radius:6px;padding:4px 8px;font-size:12px;background:var(--field)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:1px 2px 1px 10px;font-size:12px}
.chip .x{width:22px;height:22px}
.calcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel-2)}
.issue{display:flex;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line-2);cursor:pointer;border-radius:8px;align-items:flex-start}
.issue:hover{background:var(--hover)}
.issue .k{flex:none;font-weight:600;font-size:11px;padding:2px 7px;border-radius:5px}
.issue .k.e{background:var(--tint-bad);color:var(--bad)} .issue .k.w{background:var(--tint-warn);color:var(--warn)}
.wbsrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,8px);background:var(--raised);color:var(--text);border:1px solid var(--line);padding:9px 15px;border-radius:10px;font-size:12.5px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:60;max-width:90vw;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.filebtn{justify-content:flex-start;height:42px;gap:10px}
.filebtn svg{color:var(--accent-fg)}
input[type=range]{accent-color:var(--accent)}
input[type=color]{background:var(--field)!important}
@media (min-width: 821px){.main.dopen,.main.aiopen{padding-right:384px}}
.btn.sky{background:var(--tint-sky);border-color:transparent;color:var(--sky)} .btn.sky:hover{filter:brightness(1.18)}
.btn.sky[aria-expanded="true"]{box-shadow:inset 0 0 0 1px var(--sky)}
.ai{z-index:21}
.ai-log{display:flex;flex-direction:column;gap:10px}
.ai-empty p{margin:0 0 12px;color:var(--muted);line-height:1.5}
.ai-empty .btn{display:flex;width:100%;height:auto;min-height:32px;padding:7px 10px;margin-bottom:6px;white-space:normal;text-align:left;line-height:1.35}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.err{border-color:var(--bad);color:var(--text)}
.prop{margin-top:10px;padding:10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);white-space:normal}
.prop-h{font-weight:600;font-size:12.5px;margin-bottom:6px}
.prop ul{margin:0 0 8px;padding-left:18px} .prop li{margin:3px 0}
.dots{display:inline-flex;gap:4px;vertical-align:middle;padding:4px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ai-f{display:flex;gap:8px;align-items:flex-end;padding:12px 14px;border-top:1px solid var(--line)}
.ai-f textarea{flex:1;resize:none;min-height:40px;max-height:140px;border:1px solid var(--field-line);border-radius:10px;padding:9px 11px;background:var(--field);line-height:1.4}
.ai-f textarea:focus{outline:none;border-color:var(--accent-fg);box-shadow:0 0 0 3px var(--tint-accent)}
@media (max-width: 820px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr 56px}
  .rail{order:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:0 6px}
  .rail .mark,.rail .grow{display:none}
  .rb::after{display:none}
  .drawer{width:100%;top:auto;height:80%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(100%)}
  .drawer.open{transform:none}
  .search input{width:150px}
  .hide-m{display:none!important}
  #vseg{order:-1}
  .tb .sw{display:none}
  .pname{min-width:100px;max-width:200px;font-size:15px}
  .hdr{gap:10px;padding:8px 12px}
}
@media (max-width: 1720px){.w-xl{display:none!important}}
@media (max-width: 1540px){.w-lg{display:none!important}}
@media (max-width: 1400px){.acts .btn .lbl-lg{display:none}.acts .btn:has(.lbl-lg){width:34px;padding:0;justify-content:center}}
@media (max-width: 1240px){#sVarW{display:none!important}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.getRandomValues(new Uint32Array(2))).reduce((s, n) => s + n.toString(36), '');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WDL = ['S','M','T','W','T','F','S'];
const fmt = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return d + '-' + MON[+m - 1] + '-' + y.slice(2); };
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const CT = { '': 'None', SNET: 'Start on or after', SNLT: 'Start on or before', FNET: 'Finish on or after', FNLT: 'Finish on or before', MSO: 'Must start on', MFO: 'Must finish on' };
const STORE = 'opentrak.project.v1';
const LIM = { acts: 20000, rels: 60000, str: 200, notes: 4000 };

// ---------- sanitize (every project that enters the app passes through here)
function str(v, max = LIM.str) { return typeof v === 'string' ? v.slice(0, max) : v == null ? '' : String(v).slice(0, max); }
function int(v, lo, hi, def) { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def; }
function dt(v) { return CPM.isIso(v) ? v : ''; }
function sanitize(o) {
  if (!o || typeof o !== 'object') throw new Error('Not a project file.');
  if (o.format !== 'opentrak') throw new Error('This file is not an OpenTrak project.');
  const cals = (Array.isArray(o.calendars) ? o.calendars : []).slice(0, 100).map((c) => ({
    id: str(c.id, 40) || uid(), name: str(c.name, 80) || 'Calendar',
    workDays: Array.from({ length: 7 }, (_, i) => !!(c.workDays || [])[i]),
    holidays: [...new Set((Array.isArray(c.holidays) ? c.holidays : []).filter(CPM.isIso))].sort().slice(0, 2000),
  })).filter((c) => c.workDays.some(Boolean));
  if (!cals.length) cals.push(defaultCals()[0]);
  const calIds = new Set(cals.map((c) => c.id));
  const wbs = (Array.isArray(o.wbs) ? o.wbs : []).slice(0, 2000).map((w) => ({ id: str(w.id, 40) || uid(), code: str(w.code, 30), name: str(w.name, 120) || 'Group' }));
  const wbsIds = new Set(wbs.map((w) => w.id));
  const seen = new Set();
  const acts = (Array.isArray(o.activities) ? o.activities : []).slice(0, LIM.acts).map((a) => {
    let id = str(a.id, 40) || uid(); if (seen.has(id)) id = uid(); seen.add(id);
    const type = ['task', 'start', 'finish'].includes(a.type) ? a.type : 'task';
    const od = type === 'task' ? int(a.od, 0, 99999, 1) : 0;
    return {
      id, code: str(a.code, 20) || id.slice(0, 6), name: str(a.name) || '(unnamed)', type,
      wbs: wbsIds.has(a.wbs) ? a.wbs : '', cal: calIds.has(a.cal) ? a.cal : '',
      od, rd: int(a.rd, 0, 99999, od), pct: int(a.pct, 0, 100, 0), as: dt(a.as), af: dt(a.af),
      cType: Object.keys(CT).includes(a.cType) ? a.cType : '', cDate: dt(a.cDate),
      res: str(a.res, 120), cost: Number.isFinite(+a.cost) ? +a.cost : 0, notes: str(a.notes, LIM.notes),
    };
  });
  const ids = new Set(acts.map((a) => a.id)); const rk = new Set();
  const rels = (Array.isArray(o.relationships) ? o.relationships : []).slice(0, LIM.rels).filter((r) => {
    if (!ids.has(r.from) || !ids.has(r.to) || r.from === r.to) return false;
    const k = r.from + '>' + r.to; if (rk.has(k)) return false; rk.add(k); return true;
  }).map((r) => ({ id: str(r.id, 40) || uid(), from: r.from, to: r.to, type: ['FS', 'SS', 'FF', 'SF'].includes(r.type) ? r.type : 'FS', lag: int(r.lag, -9999, 9999, 0) }));
  let bl = null;
  if (o.baseline && typeof o.baseline === 'object' && o.baseline.acts) {
    bl = { name: str(o.baseline.name, 80) || 'Baseline', savedAt: str(o.baseline.savedAt, 40), finish: dt(o.baseline.finish), acts: {} };
    for (const [k, v] of Object.entries(o.baseline.acts)) if (ids.has(k) && v) bl.acts[k] = { s: dt(v.s), f: dt(v.f), d: int(v.d, 0, 99999, 0) };
  }
  return {
    format: 'opentrak', version: 1, name: str(o.name, 120) || 'Untitled project',
    startDate: dt(o.startDate) || today(), dataDate: dt(o.dataDate) || dt(o.startDate) || today(), mustFinishBy: dt(o.mustFinishBy),
    critThreshold: int(o.critThreshold, -999, 999, 0), defaultCal: calIds.has(o.defaultCal) ? o.defaultCal : cals[0].id,
    calendars: cals, wbs, activities: acts, relationships: rels, baseline: bl, layout: sanitizeLayout(o.layout),
  };
}

function defaultCals() {
  return [
    { id: 'std5', name: 'Standard 5-day', workDays: [false, true, true, true, true, true, false],
      holidays: ['2026-01-01','2026-05-25','2026-07-03','2026-09-07','2026-11-26','2026-11-27','2026-12-25','2027-01-01','2027-05-31','2027-07-05','2027-09-06','2027-11-25','2027-11-26','2027-12-24'] },
    { id: 'cal7', name: '7-day (fabrication / calendar days)', workDays: [true, true, true, true, true, true, true], holidays: [] },
  ];
}

// ---------- layout (bars, columns, rows) — saved with the project
const COLREG = {
  code: { l: 'ID', w: 74, ed: 'text' }, name: { l: 'Activity name', w: 230, ed: 'text' },
  od: { l: 'Orig dur', w: 52, n: 1, ed: 'num' }, rd: { l: 'Rem dur', w: 52, n: 1, ed: 'num' }, pct: { l: '%', w: 44, n: 1, ed: 'num' },
  start: { l: 'Start', w: 94, d: 1 }, finish: { l: 'Finish', w: 94, d: 1 },
  es: { l: 'Early start', w: 90, d: 1 }, ef: { l: 'Early finish', w: 90, d: 1 }, ls: { l: 'Late start', w: 90, d: 1 }, lf: { l: 'Late finish', w: 90, d: 1 },
  as: { l: 'Actual start', w: 90, d: 1 }, af: { l: 'Actual finish', w: 90, d: 1 },
  tf: { l: 'Total float', w: 52, n: 1 }, ff: { l: 'Free float', w: 52, n: 1 },
  bls: { l: 'BL start', w: 90, d: 1 }, blf: { l: 'BL finish', w: 90, d: 1 }, var: { l: 'BL var', w: 52, n: 1 },
  pred: { l: 'Predecessors', w: 130 }, succ: { l: 'Successors', w: 130 },
  res: { l: 'Resource', w: 120, ed: 'text' }, cost: { l: 'Budget', w: 80, n: 1, ed: 'num' },
  cal: { l: 'Calendar', w: 110 }, cons: { l: 'Constraint', w: 120 }, wbs: { l: 'WBS', w: 120 },
};
const DEFCOLS = ['code', 'name', 'od', 'rd', 'pct', 'start', 'finish', 'tf', 'var'];
const HEX = /^#[0-9a-f]{6}$/i;
const PRESETS = {
  classic: { label: 'SureTrak classic', bars: {
    remaining: { show: true, color: '#008a00', h: 10, pos: 'mid', round: false },
    critical: { color: '#e00000' }, progress: { show: true, color: '#00007d', h: 10, pos: 'mid' },
    target: { show: true, color: '#f2c200', h: 4, pos: 'bot' }, float: { show: false, color: '#000000', h: 2, pos: 'mid' },
    summary: { show: true, color: '#000000', h: 6, style: 'bracket' }, milestone: { shape: 'diamond', size: 12, color: '#008a00' },
    labelR: 'name', labelL: 'none' } },
  cvd: { label: 'Color-blind safe', bars: {
    remaining: { show: true, color: '#0072b2', h: 10, pos: 'mid', round: false },
    critical: { color: '#d55e00' }, progress: { show: true, color: '#000000', h: 10, pos: 'mid' },
    target: { show: true, color: '#f0e442', h: 4, pos: 'bot' }, float: { show: false, color: '#000000', h: 2, pos: 'mid' },
    summary: { show: true, color: '#000000', h: 6, style: 'bracket' }, milestone: { shape: 'diamond', size: 12, color: '#0072b2' },
    labelR: 'name', labelL: 'none' } },
  modern: { label: 'Modern (rounded)', bars: {
    remaining: { show: true, color: '#3b82f6', h: 12, pos: 'mid', round: true },
    critical: { color: '#dc2626' }, progress: { show: true, color: '#334155', h: 12, pos: 'mid' },
    target: { show: true, color: '#d4a017', h: 4, pos: 'bot' }, float: { show: false, color: '#94a3b8', h: 2, pos: 'mid' },
    summary: { show: true, color: '#1f2937', h: 6, style: 'bracket' }, milestone: { shape: 'diamond', size: 13, color: '#111827' },
    labelR: 'name', labelL: 'none' } },
};
const LABELS = { none: 'None', name: 'Activity name', code: 'Activity ID', codename: 'ID + name', start: 'Start date', finish: 'Finish date', dur: 'Duration', pct: '% complete', tf: 'Total float', res: 'Resource' };
function defaultLayout() {
  return { preset: 'classic', rowH: 28, fontSize: 12, links: true, bars: JSON.parse(JSON.stringify(PRESETS.classic.bars)),
    cols: Object.keys(COLREG).map((k) => ({ k, w: COLREG[k].w, show: DEFCOLS.includes(k) })).sort((a, b) => (DEFCOLS.indexOf(a.k) + 1 || 99) - (DEFCOLS.indexOf(b.k) + 1 || 99)) };
}
function sanitizeLayout(o) {
  const d = defaultLayout(); if (!o || typeof o !== 'object') return d;
  const col = (v, def) => (typeof v === 'string' && HEX.test(v) ? v.toLowerCase() : def);
  const pos = (v, def) => (['top', 'mid', 'bot'].includes(v) ? v : def);
  const b = o.bars || {}, db = d.bars, out = {};
  for (const k of ['remaining', 'progress', 'target', 'float']) {
    const s = b[k] || {}; out[k] = { show: s.show == null ? db[k].show : !!s.show, color: col(s.color, db[k].color), h: int(s.h, 1, 24, db[k].h), pos: pos(s.pos, db[k].pos) };
  }
  out.remaining.round = !!(b.remaining && b.remaining.round);
  out.critical = { color: col(b.critical && b.critical.color, db.critical.color) };

}
function persist() { try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (e) { /* storage unavailable */ } }

}

// ---------- rows
function issueIds() { const s = new Set(); for (const x of [...S.errors, ...S.warnings]) (x.ids || []).forEach((i) => s.add(i)); return s; }
function buildRows() {
  const q = ui.q.trim().toLowerCase(); const iss = ui.filter === 'issues' ? issueIds() : null;
  const pass = (a) => {
    const r = S.acts[a.id] || {};
    if (q && !(a.code.toLowerCase().includes(q) || a.name.toLowerCase().includes(q))) return false;
    if (ui.filter === 'crit' && !r.critical) return false;
    if (ui.filter === 'open' && r.status === 'done') return false;
    if (iss && !iss.has(a.id)) return false;
    return true;
  };
  const sortKey = (a) => { const r = S.acts[a.id] || {}; return [r.esP ?? 1e9, r.efP ?? 1e9, a.code]; };
  const cmp = (x, y) => { const a = sortKey(x), b = sortKey(y); for (let i = 0; i < 3; i++) { if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; } return 0; };
  const out = [];
  const groups = [...P.wbs.map((w) => ({ w, list: [] })), { w: { id: '', code: '', name: 'Unassigned' }, list: [] }];
  const gm = new Map(groups.map((g) => [g.w.id, g]));
  for (const a of P.activities) (gm.get(a.wbs) || gm.get('')).list.push(a);
  for (const g of groups) {
    const list = g.list.filter(pass).sort(cmp);
    if (!list.length && (g.w.id === '' || q || ui.filter !== 'all')) continue;
    const all = g.list.map((a) => S.acts[a.id]).filter(Boolean);
    const s = Math.min(...all.map((r) => r.esP)), f = Math.max(...all.map((r) => r.efP));
    out.push({ g: g.w, n: g.list.length, s: Number.isFinite(s) ? s : null, f: Number.isFinite(f) ? f : null, crit: all.some((r) => r.critical) });
    if (!ui.collapsed.has(g.w.id)) for (const a of list) out.push({ a });
  }
  return out;
}

// ---------- gantt
const ZOOM = { day: 26, week: 9, month: 2.6 };
function renderGantt() {
  const L = P.layout, px = ZOOM[ui.zoom], RH = L.rowH, HH = 48;
  const pts = [];
  for (const r of Object.values(S.acts)) { pts.push(r.esP, r.efP); if (P.layout.bars.float.show && r.lfP) pts.push(r.lfP); }

  pts.push(CPM.toDn(P.dataDate));
  const fin = pts.filter(Number.isFinite);
  let lo = Math.min(...fin), hi = Math.max(...fin);
  lo -= ui.zoom === 'month' ? 31 : 10; hi += ui.zoom === 'month' ? 60 : 24;
  if (ui.zoom !== 'day') lo -= CPM.weekday(lo) - 1; // align to Monday
  if (ui.zoom === 'month') { const d = new Date(lo * 864e5); lo = Math.floor(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 864e5); }
  const W = Math.max(400, Math.ceil((hi - lo) * px));
  const H = HH + Math.max(rows.length, 1) * RH;
  const X = (p) => (p - lo) * px;
  gx = { lo, px, RH, HH };
  const defCal = CPM.makeCal(calById(P.defaultCal));
  let bg = '', head = '', body = '', links = '';
  // non-work shading + grid
  if (ui.zoom !== 'month') {
    for (let d = lo; d < hi; d++) if (!defCal.isWork(d)) bg += '<rect x="' + X(d) + '" y="' + HH + '" width="' + px + '" height="' + (H - HH) + '" fill="var(--nonwork)"/>';
  }
  // header tiers
  head += '<rect x="0" y="0" width="' + W + '" height="' + HH + '" fill="var(--head)"/>';
  // top tier: months (or years for month zoom)
  let d = lo;
  while (d < hi) {
    const dt0 = new Date(d * 864e5); const y = dt0.getUTCFullYear(), m = dt0.getUTCMonth();
    const next = ui.zoom === 'month' ? Math.floor(Date.UTC(y + 1, 0, 1) / 864e5) : Math.floor(Date.UTC(y, m + 1, 1) / 864e5);
    const e = Math.min(next, hi);
    head += '<line x1="' + X(d) + '" y1="0" x2="' + X(d) + '" y2="' + HH + '" stroke="var(--line)"/>';
    if (X(e) - X(d) > 30) head += '<text class="tm" x="' + (X(d) + 6) + '" y="17">' + (ui.zoom === 'month' ? y : MON[m] + ' ' + y) + '</text>';
    d = next;
  }
  head += '<line x1="0" y1="24" x2="' + W + '" y2="24" stroke="var(--line)"/>';
  // bottom tier
  if (ui.zoom === 'day') {
    for (let k = lo; k < hi; k++) { const dd = new Date(k * 864e5); head += '<text class="th" x="' + (X(k) + px / 2) + '" y="36" text-anchor="middle">' + WDL[dd.getUTCDay()] + '</text><text class="th" x="' + (X(k) + px / 2) + '" y="45" text-anchor="middle" style="font-size:9px">' + dd.getUTCDate() + '</text>'; if (dd.getUTCDay() === 1) bg += '<line x1="' + X(k) + '" y1="' + HH + '" x2="' + X(k) + '" y2="' + H + '" stroke="var(--line2)"/>'; }
  } else if (ui.zoom === 'week') {
    for (let k = lo; k < hi; k += 7) { const dd = new Date(k * 864e5); head += '<text class="th" x="' + (X(k) + 3) + '" y="40">' + dd.getUTCDate() + '</text>'; bg += '<line x1="' + X(k) + '" y1="' + HH + '" x2="' + X(k) + '" y2="' + H + '" stroke="var(--line2)"/>'; }
  } else {
    let k = lo; while (k < hi) { const dd = new Date(k * 864e5); const n = Math.floor(Date.UTC(dd.getUTCFullYear(), dd.getUTCMonth() + 1, 1) / 864e5); head += '<text class="th" x="' + (X(k) + 3) + '" y="40">' + MON[dd.getUTCMonth()][0] + '</text>'; bg += '<line x1="' + X(k) + '" y1="' + HH + '" x2="' + X(k) + '" y2="' + H + '" stroke="var(--line2)"/>'; k = n; }
  }
  // rows
  const B = screenBars(L.bars), rowY = new Map();
  const band = (spec, y) => { const h = Math.min(spec.h, RH - 4); return spec.pos === 'top' ? y + 3 : spec.pos === 'bot' ? y + RH - 3 - h : y + (RH - h) / 2; };
  const rx = B.remaining.round ? Math.min(4, B.remaining.h / 2) : 0;
  const msShape = (x, cy, s, fill, cls) => {
    const h = s / 2; let d;

function startEdit(td) {

  const id = td.parentElement.dataset.id, k = td.dataset.k, a = act(id); if (!a) return;
  const r = S.acts[id] || {};
  const val = k === 'code' ? a.code : k === 'name' ? a.name : k === 'od' ? a.od : k === 'rd' ? a.rd : k === 'res' ? a.res : k === 'cost' ? (a.cost || '') : (r.status === 'done' ? 100 : a.pct);
  const inp = document.createElement('input'); inp.className = 'cell'; inp.value = val;
  if (COLREG[k].ed === 'num') { inp.type = 'number'; inp.min = 0; if (k === 'pct') inp.max = 100; }
  td.textContent = ''; td.appendChild(inp); inp.focus(); inp.select();
  let done = false;
  const finish = (save, move) => {
    if (done) return; done = true;
    if (save && String(inp.value) !== String(val)) commit(() => setField(a, k, inp.value)); else render();
    if (move) {
      const cells = $$('#grid td.ed'); const cur = $('#grid tr[data-id="' + CSS.escape(id) + '"] td[data-k="' + k + '"]');
      const i = cells.indexOf(cur); const nx = cells[i + move]; if (nx) { ui.sel = nx.parentElement.dataset.id; markSel(); startEdit(nx); }
    }
  };
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    else if (e.key === 'Tab') { e.preventDefault(); finish(true, e.shiftKey ? -1 : 1); }
    e.stopPropagation();
  });
  inp.addEventListener('blur', () => finish(true));
}

    const d = (v) => (v == null ? undefined : String(v).toLowerCase() === 'none' || v === '' ? '' : dt(String(v)) || null);
    if (t === 'add_activity') out.push({ type: t, code: s(x.code, 20), name: s(x.name) || 'New activity', wbs: s(x.wbs, 120), kind: ['task', 'start', 'finish'].includes(x.kind) ? x.kind : 'task', duration: n(x.duration, 0, 9999), after: (Array.isArray(x.after) ? x.after : []).slice(0, 20).map((c) => str(c, 20)), resource: s(x.resource, 120) });
    else if (t === 'update_activity') { const c = { type: t, code: s(x.code, 20) }; for (const k of ['name', 'resource', 'notes', 'wbs']) if (x[k] != null) c[k] = s(x[k], k === 'notes' ? LIM.notes : LIM.str); for (const k of ['duration', 'remaining']) if (x[k] != null) c[k] = n(x[k], 0, 9999); if (x.percent != null) c.percent = n(x.percent, 0, 100); for (const k of ['actual_start', 'actual_finish', 'constraint_date']) if (x[k] !== undefined) c[k] = d(x[k]); if (x.constraint != null) c.constraint = AI_CT[String(x.constraint).toUpperCase()] ? String(x.constraint).toUpperCase() : ''; out.push(c); }
    else if (t === 'delete_activity') out.push({ type: t, code: s(x.code, 20) });

  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!ui.sel) { const f = rows.find((r) => r.a); if (f) select(f.a.id, true); } else step(e.key === 'ArrowDown' ? 1 : -1); }
  if (e.key === 'Delete' && ui.sel) { e.preventDefault(); delActivity(ui.sel); }
  if (e.key === 'F2' && ui.sel) { e.preventDefault(); startEdit($('#grid tr[data-id="' + CSS.escape(ui.sel) + '"] td[data-k="name"]')); }
});

// ---------- boot
let boot = null;
try { const s = localStorage.getItem(STORE); if (s) boot = sanitize(JSON.parse(s)); } catch (e) { boot = null; }
if (mobile()) ui.view = 'table';
let wasM = mobile(); window.addEventListener('resize', () => { if (mobile() !== wasM) { wasM = mobile(); if (wasM && ui.view === 'both') ui.view = 'table'; render(); } });
load(boot || sample());
if (!mobile()) $('#left').style.width = Math.min(cols().reduce((s, c) => s + c.w, 0) + 2, Math.round(window.innerWidth * 0.55)) + 'px';
setTimeout(scrollToDataDate, 0);
window.__ot = { get P() { return P; }, get S() { return S; }, ui };
})();
